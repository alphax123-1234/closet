<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLOSET | Fashion & AI Try-On</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .shimmer-bar { animation: shimmer 1.4s linear infinite; }
  .garment { opacity: 0; transition: opacity .4s; }
  .garment.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .shimmer-bar { animation: none; } .garment { transition: none; } }
</style>
</head>
<body class="bg-black font-sans text-neutral-200 antialiased">
<div id="site-header"></div>

<main class="mx-auto grid max-w-7xl grid-cols-12 gap-3 px-3 py-3 md:gap-8 md:px-8 md:py-8">

  <!-- LEFT: AI avatar model panel (sticky) -->
  <aside class="sticky top-[7.5rem] col-span-5 self-start md:top-20 md:col-span-4">
    <div class="relative mx-auto aspect-[3/4] max-h-[calc(100dvh-14rem)] overflow-hidden rounded-2xl border border-neutral-800 bg-neutral-950">
      <!-- Minimalist silhouette (default) -->
      <svg id="mSvg" viewBox="0 0 300 420" class="h-full w-full" role="img" aria-label="Model silhouette">
        <defs>
          <pattern id="p-dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9822b"/><circle cx="6" cy="6" r="3" fill="#fff3d6"/></pattern>
          <pattern id="p-stripes" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#1f6f5c"/><rect width="5" height="14" fill="#f2c14e"/></pattern>
        </defs>
        <ellipse cx="150" cy="408" rx="75" ry="6" fill="rgba(255,255,255,.06)"/>
        <g fill="#262626" stroke="#3a3a3a">
          <ellipse cx="150" cy="48" rx="22" ry="28"/><rect x="141" y="72" width="18" height="20"/>
          <path d="M106 98 L80 205 L94 211 L112 140 Z M194 98 L220 205 L206 211 L188 140 Z"/>
          <path d="M108 96 Q150 86 192 96 L188 150 Q184 185 190 215 L110 215 Q116 185 112 150 Z"/>
          <path d="M110 213 L190 213 L184 396 L156 396 L150 268 L144 396 L116 396 Z"/>
          <ellipse cx="130" cy="402" rx="17" ry="6"/><ellipse cx="170" cy="402" rx="17" ry="6"/>
        </g>
        <path id="g-bottoms" class="garment" stroke="rgba(255,255,255,.3)"/>
        <path id="g-tops" class="garment" stroke="rgba(255,255,255,.3)"/>
      </svg>
      <!-- Uploaded / AI-generated photo (shown instead of the silhouette when available) -->
      <img id="photo" alt="Model" class="absolute inset-0 hidden h-full w-full object-contain">

      <label class="absolute left-2 top-2 cursor-pointer rounded-md bg-black/70 px-2 py-1 text-xs text-neutral-300 ring-1 ring-neutral-700 hover:text-white">
        Upload photo<input id="upload" type="file" accept="image/*" class="sr-only">
      </label>

      <!-- Loading overlay -->
      <div id="overlay" class="pointer-events-none absolute inset-0 overflow-hidden bg-black/40 opacity-0 backdrop-blur-md transition-opacity duration-200" role="status" aria-label="Generating outfit">
        <div class="shimmer-bar absolute inset-y-0 w-2/3 bg-gradient-to-r from-transparent via-white/25 to-transparent"></div>
        <p id="overlayText" class="absolute bottom-3 left-2 right-2 text-center text-xs font-medium text-neutral-200 md:text-sm">Fitting…</p>
      </div>
    </div>

    <div class="mt-2 grid grid-cols-2 gap-2">
      <button id="resetBtn" class="rounded-lg border border-neutral-700 py-2.5 text-xs font-semibold uppercase tracking-wider text-white transition hover:bg-neutral-900 md:text-sm">Start Over</button>
      <button id="buyBtn" disabled class="rounded-lg bg-amber-400 py-2.5 text-xs font-bold uppercase tracking-wider text-black transition hover:bg-amber-300 disabled:cursor-not-allowed disabled:opacity-40 md:text-sm">Buy Outfit</button>
    </div>
    <p id="total" class="mt-2 hidden text-center text-xs text-neutral-400"></p>
    <p id="err" role="alert" class="mt-2 hidden rounded-lg bg-neutral-900 px-3 py-2 text-xs text-amber-300 ring-1 ring-neutral-800"></p>
  </aside>

  <!-- RIGHT: clothing catalog -->
  <section class="col-span-7 min-w-0 md:col-span-8">
    <h1 class="mb-4 text-xl font-bold tracking-tight text-white md:mb-6 md:text-2xl">Fashion</h1>
    <div id="grid" class="grid grid-cols-1 gap-3 md:grid-cols-2 md:gap-5 xl:grid-cols-3"></div>
    <p id="empty" class="hidden py-10 text-center text-neutral-500">No items match your search.</p>
  </section>
</main>

<!-- Order dialog -->
<dialog id="orderDialog" class="w-[min(92vw,26rem)] rounded-2xl border border-neutral-800 bg-neutral-950 p-0 text-neutral-200 shadow-2xl backdrop:bg-black/70">
  <div class="p-5">
    <h2 class="text-lg font-semibold text-white">Your outfit</h2>
    <ul id="orderItems" class="mt-3 divide-y divide-neutral-800 text-sm"></ul>
    <p id="orderTotalRow" class="mt-3 flex justify-between font-semibold text-white"><span>Total</span><span id="orderTotal"></span></p>
    <a id="whatsappLink" target="_blank" rel="noopener" class="mt-4 block rounded-lg bg-amber-400 py-2.5 text-center text-sm font-bold text-black transition hover:bg-amber-300">Order on WhatsApp</a>
    <button id="closeDialog" class="mt-2 w-full rounded-lg border border-neutral-700 py-2.5 text-sm font-medium hover:bg-neutral-900">Keep browsing</button>
  </div>
</dialog>

<script>
// ===== Shared: header + helpers (CLOSET) =====
const WHATSAPP_NUMBER = "256700000000"; // placeholder: country code, no + or spaces
const ugx = (n) => "UGX " + n.toLocaleString("en-UG");
const ic = (p) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  cart: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.5L22 7H6"/>',
};

// Global header: logo (left) | search (centre) | Account, Help, Cart (right)
function renderHeader({ cartHref }) {
  const btn = "flex items-center gap-1.5 rounded-lg px-2.5 py-2 text-sm text-neutral-300 transition hover:bg-neutral-900 hover:text-white";
  document.getElementById("site-header").innerHTML = `
  <header class="sticky top-0 z-40 border-b border-neutral-800 bg-black/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-4 gap-y-2 px-3 py-3 md:px-8">
      <a href="index.html" class="text-2xl font-bold tracking-[0.3em] text-white">CLOSET</a>

      <form action="fashion.html" class="order-last flex w-full items-center gap-2 rounded-full border border-neutral-700 bg-neutral-950 px-4 text-neutral-400 focus-within:border-amber-400 md:order-none md:mx-auto md:w-auto md:max-w-xl md:flex-1">
        ${ic(ICONS.search)}
        <input id="q" name="q" type="search" placeholder="Search products, brands and boutiques" class="w-full bg-transparent py-2.5 text-sm text-white outline-none placeholder:text-neutral-500" aria-label="Search">
      </form>

      <div class="ml-auto flex items-center gap-1 md:ml-0">
        <details class="relative">
          <summary class="${btn} cursor-pointer list-none">${ic(ICONS.user)}<span class="hidden sm:inline">Account</span></summary>
          <div class="absolute right-0 mt-2 w-44 rounded-lg border border-neutral-800 bg-neutral-950 p-1 text-sm shadow-xl">
            <button class="block w-full rounded px-3 py-2 text-left text-neutral-300 hover:bg-neutral-900">Sign in</button>
            <button class="block w-full rounded px-3 py-2 text-left text-neutral-300 hover:bg-neutral-900">Create account</button>
            <button class="block w-full rounded px-3 py-2 text-left text-neutral-300 hover:bg-neutral-900">My orders</button>
          </div>
        </details>
        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hello, I need help with CLOSET")}" target="_blank" rel="noopener" class="${btn}">${ic(ICONS.help)}<span class="hidden sm:inline">Help</span></a>
        <a id="cartLink" href="${cartHref}" class="${btn}">${ic(ICONS.cart)}<span class="hidden sm:inline">Cart</span>
          <span id="cartCount" class="min-w-5 rounded-full bg-amber-400 px-1.5 text-center text-xs font-bold text-black">0</span></a>
      </div>
    </div>
  </header>`;
}

renderHeader({ cartHref: "#cart" });

/* =====================================================================
   AI INTEGRATION HOOKS: connect these to YOUR backend.
   Never put API keys in this file. The browser calls your server, and
   your server calls the background-removal / image-generation services.
   ===================================================================== */
const CONFIG = { API_BASE: "" }; // e.g. "https://closet-api.onrender.com". Empty = demo mode.

/**
 * Hook 1: background removal.
 * Takes an image link and returns a link to a clean PNG with a transparent background.
 */
async function removeImageBackground(imageSrc) {
  if (!CONFIG.API_BASE || !imageSrc) return imageSrc;          // demo mode: return unchanged
  // TODO: connect your background-removal service through your backend, e.g.
  // const res = await fetch(`${CONFIG.API_BASE}/api/remove-background`, {
  //   method: "POST", headers: { "Content-Type": "application/json" },
  //   body: JSON.stringify({ imageUrl: imageSrc }),
  // });
  // if (!res.ok) throw new Error("Background removal failed.");
  // return (await res.json()).imageUrl;
  return imageSrc;
}

/**
 * Hook 2: AI outfit generator.
 * Sends the model and the clean garment to the image-generation model and returns
 * { imageUrl } of the model wearing the item. Returns { imageUrl: null } in demo mode.
 */
async function generateAIOutfit(modelId, itemData) {
  if (!CONFIG.API_BASE) {                                      // demo mode: just wait a moment
    await new Promise((r) => setTimeout(r, 1800));
    return { imageUrl: null };
  }
  // TODO: connect to your backend route that calls the try-on model, e.g.
  // const res = await fetch(`${CONFIG.API_BASE}/api/try-on`, {
  //   method: "POST", headers: { "Content-Type": "application/json" },
  //   body: JSON.stringify({
  //     mannequinUrl: currentModelUrl,        // the model photo as a PUBLIC link
  //     garmentUrl: itemData.image,           // the clean garment from removeImageBackground()
  //     clothingCategory: itemData.category,  // "tops" | "bottoms"
  //   }),
  // });
  // const data = await res.json();
  // if (!res.ok) throw new Error(data.error || "Outfit generation failed.");
  // return { imageUrl: data.imageUrl };
  return { imageUrl: null };
}

/* ===================== Catalog (mock data) ===================== */
const SHAPES = {
  tops:     { d: "M96 98 Q150 82 204 98 L228 150 L208 164 L194 142 L196 222 L104 222 L106 142 L92 164 L72 150 Z", vb: "60 78 180 160" },
  trousers: { d: "M104 212 L196 212 L188 395 L156 395 L150 265 L144 395 L112 395 Z", vb: "95 205 110 200" },
  skirt:    { d: "M104 212 L196 212 L216 335 L84 335 Z", vb: "75 205 150 135" },
};
// image: a link to the garment photo, e.g. "images/linen-shirt.png" (leave "" to use the drawn shape)
const products = [
  { id: 1, boutique: "Kololo Atelier",    title: "Linen Button Shirt",  price: 85000,  category: "tops",    shape: "tops",     fill: "#e9e3d3",          image: "" },
  { id: 2, boutique: "Bugolobi Bespoke",  title: "Kitenge Print Blouse", price: 70000, category: "tops",    shape: "tops",     fill: "url(#p-stripes)",  image: "" },
  { id: 3, boutique: "Kampala Threads",   title: "Ankara Print Shirt",  price: 50000,  category: "tops",    shape: "tops",     fill: "url(#p-dots)",     image: "" },
  { id: 4, boutique: "Kabalagala Style",  title: "High-Waist Trousers", price: 120000, category: "bottoms", shape: "trousers", fill: "#4b5d73",          image: "" },
  { id: 5, boutique: "Ntinda Threads",    title: "Pleated Midi Skirt",  price: 95000,  category: "bottoms", shape: "skirt",    fill: "#a33b4c",          image: "" },
  { id: 6, boutique: "Muyenga Denim Co.", title: "Straight-Leg Jeans",  price: 110000, category: "bottoms", shape: "trousers", fill: "#3f5f8a",          image: "" },
];

/* ===================== State & helpers ===================== */
const look = { tops: null, bottoms: null };      // the model starts undressed
let busy = false, query = "", modelId = "default-avatar", baseUrl = "", currentModelUrl = "";
const $ = (id) => document.getElementById(id);
const worn = () => Object.values(look).filter(Boolean);
const showErr = (m) => { $("err").textContent = m; $("err").classList.remove("hidden"); };
const hideErr = () => $("err").classList.add("hidden");

function renderProducts() {
  const q = query.trim().toLowerCase();
  const list = products.filter((p) => !q || (p.title + " " + p.boutique).toLowerCase().includes(q));
  $("empty").classList.toggle("hidden", list.length > 0);
  $("grid").innerHTML = list.map((p) => `
    <article class="group overflow-hidden rounded-xl border bg-neutral-950 transition duration-300 hover:-translate-y-1 hover:shadow-[0_12px_40px_rgba(251,191,36,.12)] ${look[p.category]?.id === p.id ? "border-amber-400" : "border-neutral-800 hover:border-neutral-600"}">
      <div class="flex aspect-[3/4] items-center justify-center overflow-hidden bg-neutral-900">
        ${p.image
          ? `<img src="${p.image}" alt="${p.title}" class="h-full w-full object-contain transition-transform duration-500 group-hover:scale-105">`
          : `<svg viewBox="${SHAPES[p.shape].vb}" class="w-3/5 transition-transform duration-500 group-hover:scale-105" aria-hidden="true"><path d="${SHAPES[p.shape].d}" fill="${p.fill}" stroke="rgba(255,255,255,.3)"/></svg>`}
      </div>
      <div class="space-y-1 p-3 md:p-4">
        <p class="text-xs uppercase tracking-wider text-neutral-500">${p.boutique}</p>
        <h3 class="font-medium text-white">${p.title}</h3>
        <p class="text-sm font-semibold text-amber-400">${ugx(p.price)}</p>
        <button data-id="${p.id}" class="try-btn mt-3 w-full rounded-lg bg-white py-2 text-sm font-bold text-black transition hover:bg-amber-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-50">Try On</button>
      </div>
    </article>`).join("");
}

function syncOutfit() {
  for (const cat of ["tops", "bottoms"]) {                    // demo drawing on the silhouette
    const g = $("g-" + cat), p = look[cat];
    if (p) { g.setAttribute("d", SHAPES[p.shape].d); g.setAttribute("fill", p.fill); }
    g.classList.toggle("on", !!p);
  }
  const items = worn(), total = items.reduce((s, p) => s + p.price, 0);
  $("buyBtn").disabled = items.length === 0;
  $("total").classList.toggle("hidden", !items.length);
  $("total").textContent = items.length + " item" + (items.length > 1 ? "s" : "") + " · " + ugx(total);
  $("cartCount").textContent = items.length;
}

/* Try On: remove background -> generate outfit -> refresh the left panel */
async function tryOn(id, button) {
  if (busy) return;
  busy = true; hideErr();
  const p = products.find((x) => x.id === id);
  document.querySelectorAll(".try-btn").forEach((b) => (b.disabled = true));
  button.textContent = "Fitting...";
  $("overlay").classList.remove("opacity-0");
  try {
    $("overlayText").textContent = "Preparing the garment…";
    const cleanImage = await removeImageBackground(p.image);               // step 1
    $("overlayText").textContent = "Fitting your garment…";
    const result = await generateAIOutfit(modelId, { ...p, image: cleanImage }); // step 2
    if (result.imageUrl) {                                                  // step 3: show the AI photo
      currentModelUrl = result.imageUrl;
      $("photo").src = currentModelUrl; $("photo").classList.remove("hidden"); $("mSvg").classList.add("hidden");
    }
    look[p.category] = p;                                                   // (demo mode draws on the silhouette)
  } catch (e) {
    showErr(e.message || "Something went wrong. Please try again.");
  } finally {
    $("overlay").classList.add("opacity-0"); busy = false;
    renderProducts(); syncOutfit();
  }
}

function openOrder() {
  const items = worn(), total = items.reduce((s, p) => s + p.price, 0), has = items.length > 0;
  $("orderItems").innerHTML = has ? items.map((p) =>
    `<li class="flex justify-between py-2"><span>${p.title}<span class="block text-xs text-neutral-500">${p.boutique}</span></span><span>${ugx(p.price)}</span></li>`).join("")
    : '<li class="py-2 text-neutral-500">Your outfit is empty. Try something on first.</li>';
  $("orderTotalRow").classList.toggle("hidden", !has);
  $("whatsappLink").classList.toggle("hidden", !has);
  $("orderTotal").textContent = ugx(total);
  const msg = "Hello, I'd like to order: " + items.map((p) => `${p.title} (${p.boutique}, ${ugx(p.price)})`).join("; ") + `. Total: ${ugx(total)}`;
  $("whatsappLink").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  $("orderDialog").showModal();
}

/* ===================== Events ===================== */
$("grid").addEventListener("click", (e) => { const b = e.target.closest(".try-btn"); if (b) tryOn(Number(b.dataset.id), b); });
$("buyBtn").onclick = openOrder;
$("cartLink").onclick = (e) => { e.preventDefault(); openOrder(); };
$("closeDialog").onclick = () => $("orderDialog").close();

$("resetBtn").onclick = () => {
  if (busy) return;
  look.tops = look.bottoms = null; hideErr();
  if (baseUrl) { currentModelUrl = baseUrl; $("photo").src = baseUrl; }    // back to the uploaded photo
  else { $("photo").classList.add("hidden"); $("mSvg").classList.remove("hidden"); }
  renderProducts(); syncOutfit();
};

// Upload your own photo (preview only; for real AI try-on it must be saved to a public link)
$("upload").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    baseUrl = currentModelUrl = r.result; modelId = "user-upload-" + Date.now();
    $("photo").src = baseUrl; $("photo").classList.remove("hidden"); $("mSvg").classList.add("hidden");
    look.tops = look.bottoms = null; renderProducts(); syncOutfit();
  };
  r.readAsDataURL(file);
};

// Header search filters the catalog (also reads ?q= from the home page)
const qEl = $("q");
qEl.value = query = new URLSearchParams(location.search).get("q") || "";
qEl.form.addEventListener("submit", (e) => e.preventDefault());
qEl.addEventListener("input", () => { query = qEl.value; renderProducts(); });

renderProducts(); syncOutfit();
</script>
</body>
</html>
